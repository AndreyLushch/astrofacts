# Конфигурация расчёта по умолчанию. Хэш действующей конфигурации попадает в meta ответа.
# Другой файл подключается переменной окружения ASTROFACTS_CONFIG.

bodies = ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto"]

[aspects]
# Минорные (semisextile, semisquare, sesquiquadrate, quincunx) включаются добавлением в список.
enabled = ["conjunction", "sextile", "square", "trine", "opposition"]

[orbs.background]
# Орб фоновых аспектов между медленными планетами, градусы. Точные аспекты суток отбираются
# по событию (аспект становится точным), орб к ним не применяется.
conjunction = 5.0
opposition = 5.0
square = 5.0
trine = 5.0
sextile = 3.0
semisextile = 1.0
semisquare = 1.0
sesquiquadrate = 1.0
quincunx = 1.0

[background]
# Фоновый аспект помечается generational, если пара проходит его орб в среднем дольше этого
# срока: (2 × орб) / разность средних скоростей тел. Такой аспект одинаков изо дня в день
# и контекстом конкретных суток не является. Срок считается по средним скоростям, а не по
# фактическому пребыванию в орбе: из-за попятных петель оно рвётся на эпизоды разной длины,
# и пометка менялась бы от года к году у одного и того же аспекта.
# При 550 сутках поколенческими выходят пары Уран — Нептун, Уран — Плутон, Нептун — Плутон.
generational_after_days = 550

[speed]
# Порог, градусов в сутки. Время отдаётся у всех событий; порог управляет только пометками.
# Аспект, взаимная скорость пары в момент точности которого ниже порога, помечается slow_pair:
# конфигурация почти не меняется несколько суток, и минута точности мало что значит.
# Тело со средней скоростью ниже порога считается медленным: его аспекты с другими
# медленными телами идут в фон.
slow_threshold_deg_per_day = 0.1

[void_of_course]
# Луна без курса: от последнего точного аспекта из списка к телам из списка до смены знака.
bodies = ["sun", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto"]
aspects = ["conjunction", "sextile", "square", "trine", "opposition"]

[stations]
window_days = 7

[lookahead]
# Окно опережения за границей суток, часы: значение по умолчанию для параметра запроса и предел.
default_hours = 0
max_hours = 24

[rulers]
# modern: Скорпион — Плутон, Водолей — Уран, Рыбы — Нептун; traditional: Марс, Сатурн, Юпитер.
scheme = "modern"

[cache]
max_entries = 512
