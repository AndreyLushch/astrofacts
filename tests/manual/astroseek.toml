# Значения, сверенные вручную с внешними источниками. Это эталон: расчёт обязан с ними совпадать.
# Источник по умолчанию — astro-seek.com; если он другой, у записи есть поле source.
# Время UTC, в том виде, как его показывает источник — с точностью до минуты, секунды отброшены.
# Новые точки добавляет человек после сверки; расчётом этот файл не пополняется.

# Луна без курса: начало интервала. Обе точки различают конвенции (последний аспект — к Плутону)
# и способ записи минуты (точные моменты 14:22:31 и 14:13:39).
[[void_of_course]]
date = "2023-03-03"
tz = "UTC"
start = "14:22"
verified = "2026-10-12"

[[void_of_course]]
date = "2023-03-17"
tz = "UTC"
start = "14:13"
verified = "2026-10-12"

# Станция планеты. Момент чувствителен к системе отсчёта: без нутации расчёт дал бы 03:36,
# поэтому эта точка подтверждает способ расчёта станций всех медленных планет.
[[station]]
date = "2026-10-16"
tz = "UTC"
body = "pluto"
direction = "direct"
time = "02:40"
source = "внешний источник, сверено вручную"
verified = "2026-10-12"
